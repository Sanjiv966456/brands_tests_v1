[pytest]
testpaths = tests
addopts = -ra
markers =
    smoke: critical page and brand listing checks
    regression: broader behavior and link checks
    a11y: accessibility checks
    responsive: viewport checks
    negative: malformed input and URL edge checks
    smoke: quick sanity checks
    regression: full regression suite
    a11y: accessibility tests
    responsive: viewport tests
    negative: negative scenarios
    brand_links: brand card link status checks
