name: Brands UI tests

on:
  push:
    paths:
      - "brands_tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "brands_tests/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: brands_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: brands_tests/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run tests
        run: pytest -n 4 --browser ${{ matrix.browser }} --alluredir=allure-results
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brands-test-results-${{ matrix.browser }}
          path: brands_tests/allure-results
